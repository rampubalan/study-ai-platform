<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DaRa AI - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>DaRa AI</h1>
        <button id="theme-btn" onclick="toggleTheme()">🌙 Dark Mode</button>
    </header>

    <main>
        <section id="login-section" class="card">
            <h2>Student Login</h2>
            <form id="login-form">
                <input type="email" id="email" placeholder="Enter your email" required>
                <input type="password" id="password" placeholder="Enter password" required>
                <button type="submit">Login</button>
            </form>
            <p style="margin-top: 1rem; font-size: 0.9rem; text-align: center;">
                Don't have an account? <a href="register.html" style="color: var(--primary-color, #6366F1);">Register here</a>
            </p>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
